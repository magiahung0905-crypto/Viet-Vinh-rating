<style>
:root{--bg:#fff;--card:#fff;--tx:#111;--mut:#7b7b7b;--bd:#e8e8e8;--ac:#e4322b;--ac2:color-mix(in srgb,var(--ac) 8%,var(--card));--ok:#12a150;--bad:#d64545;--sh:0 1px 0 rgba(0,0,0,.03);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=dark]{--bg:#0e0e0e;--card:#171717;--tx:#f2f2f2;--mut:#8f8f8f;--bd:#2a2a2a;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(800px 420px at 95% -8%,color-mix(in srgb,var(--ac) 9%,transparent),transparent),var(--bg);min-height:100vh;transition:background .4s,color .4s}
.wrap{max-width:1100px;margin:0 auto;padding:6px 18px 70px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 14px;width:100%;transition:border .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac)}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;cursor:pointer}.brand svg{width:34px;height:34px}
.acts{display:flex;gap:8px}
.ic{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);font-size:18px;transition:transform .2s}.ic:active{transform:scale(.9)}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:10px 18px;font-weight:600;transition:all .2s}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 8px 20px -8px var(--ac)}.btn.d{color:var(--bad)}.btn:disabled{opacity:.4;pointer-events:none}.btn.sm{padding:5px 12px;font-size:13px}.btn.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
@media(hover:hover){.btn:hover{border-color:var(--ac);color:var(--ac)}.btn.p:hover{color:#fff;filter:brightness(1.1)}.ic:hover{transform:translateY(-3px) rotate(8deg)}}
.mut{color:var(--mut);font-size:13px}.hero p{color:var(--mut);margin:0 0 16px;font-size:16px}
.vh{display:flex;align-items:center;gap:12px;margin:8px 0 16px}.vh h2{margin:0;font-size:26px;letter-spacing:-.03em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);animation:up .5s both}.card h3{margin:0 0 10px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.row.n>*{flex:none}
.f{margin:12px 0}.f label,.pop label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:10px 0 5px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;background:var(--ac2);border-radius:99px;padding:4px;margin-bottom:10px}.seg button{flex:1;padding:8px;border-radius:99px;font-weight:600}.seg .on{background:var(--ac);color:#fff}
.err{color:var(--bad);font-size:13px;min-height:18px}
.stars{display:flex;gap:6px}.stars button{width:46px;height:42px;border:1px solid var(--bd);border-radius:12px;background:var(--card);font-weight:700;transition:transform .15s}.stars .on{background:var(--ac);color:#fff;border-color:var(--ac);transform:translateY(-3px) scale(1.06);box-shadow:0 8px 16px -6px var(--ac)}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:22px;margin:34px 14px 0 0;perspective:900px}
.step{position:relative;flex:1;max-width:210px;border-radius:12px 12px 0 0;padding:12px 6px;text-align:center;background:linear-gradient(180deg,var(--card),var(--ac2));border:1px solid var(--bd);border-bottom:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) both;transition:transform .25s}
.step:before,.step:after{content:"";position:absolute;background:var(--ac)}
.step:before{left:0;right:0;top:-14px;height:14px;opacity:.35;transform:skewX(-45deg);transform-origin:bottom left}
.step:after{top:0;right:-14px;width:14px;height:100%;opacity:.7;transform:skewY(-45deg);transform-origin:top left}
.step:active{transform:scale(.97)}.step.s1{height:250px}.step.s2{height:200px}.step.s3{height:160px}
@media(hover:hover){.step:hover{transform:translateY(-8px)}}
.step .sc0{font-size:clamp(26px,5vw,44px);font-weight:800;letter-spacing:-.04em;line-height:1.05;color:var(--ac)}.step .md{font-size:26px}.step b{display:block;font-size:14px}
.base{height:10px;background:linear-gradient(var(--ac),color-mix(in srgb,var(--ac) 60%,#000));border-radius:0 0 8px 8px;margin-right:14px}
.rw{display:flex;align-items:center;gap:14px;padding:14px 6px;border-bottom:1px solid var(--bd);cursor:pointer;width:100%;text-align:left;animation:slide .4s both;transition:padding .2s}
.rw:last-child{border:0}.rw .n{width:26px;font-weight:800;color:var(--mut)}.rw .nm{flex:1}.rw .scr{font-weight:800;font-size:22px;color:var(--ac)}
@media(hover:hover){.rw:hover{padding-left:16px;background:var(--ac2)}}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--ac2);color:var(--ac);font-size:12px;font-weight:600}
.bar{height:6px;border-radius:9px;background:var(--ac2);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:9px;background:var(--ac);animation:grow 1s both}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);font-size:14px}th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.cm{padding:12px 0;border-bottom:1px solid var(--bd)}.cm:last-child{border:0}.cm p{margin:4px 0 8px}.cmh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.cmh .mut{margin-left:auto}
.bestc{background:var(--ac2);border-radius:14px;padding:12px;margin:12px 0}
.ov{position:fixed;inset:0;background:rgba(10,16,30,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fade .25s}
@media(min-width:600px){.ov{align-items:center;padding:16px}}
.mdl{background:var(--card);border-radius:26px 26px 0 0;max-width:500px;width:100%;max-height:90vh;overflow:auto;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));animation:sheet .4s cubic-bezier(.2,.8,.2,1) both}
@media(min-width:600px){.mdl{border-radius:26px}}
.crow{margin:12px 0}.crow .tp{display:flex;justify-content:space-between;font-weight:600}
.pop-bg{position:fixed;inset:0;z-index:30}.pop{position:fixed;right:14px;top:calc(66px + env(safe-area-inset-top,0px));width:min(310px,calc(100vw - 28px));background:var(--card);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh);padding:16px;z-index:31;animation:pp .3s cubic-bezier(.2,.8,.2,1) both;transform-origin:top right}
.pop h3{margin:0 0 4px}.pop hr{border:0;border-top:1px solid var(--bd);margin:14px 0}
.sw{display:flex;gap:10px}.sw button{width:32px;height:32px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--bd);transition:transform .2s}.sw .on{box-shadow:0 0 0 2px var(--tx);transform:scale(1.15)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 20px;border-radius:99px;animation:up .4s,out .4s 2.6s forwards;z-index:60;box-shadow:var(--sh)}
.cf{position:fixed;font-size:22px;pointer-events:none;animation:burst 1.2s ease-out forwards;z-index:60}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(90px)}}@keyframes fade{from{opacity:0}}
@keyframes sheet{from{transform:translateY(60px);opacity:0}}@keyframes pp{from{opacity:0;transform:scale(.85)}}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-12px)}}@keyframes grow{from{width:0}}
@keyframes out{to{opacity:0}}@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mut{color:var(--mut);font-size:13px}.lc{text-transform:lowercase}
.ic{background:transparent;box-shadow:none;border-color:transparent;color:var(--tx)}
.card{border-radius:18px;box-shadow:none}.btn.p{box-shadow:none}
.brand span{font-weight:600;letter-spacing:-.02em;font-size:18px}
.lg{border:1px solid var(--tx);border-radius:99px;padding:9px 20px;font-weight:600;transition:all .2s}
@media(hover:hover){.lg:hover{background:var(--tx);color:var(--bg)}}
.chip{border:1px solid var(--bd);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600}
.hero{position:relative;height:calc(100vh - 100px);height:calc(100svh - 100px);min-height:480px;user-select:none;-webkit-user-select:none}
.stage{position:absolute;inset:0;perspective:1200px;touch-action:none;cursor:grab}.stage:active{cursor:grabbing}
.grp{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.obj{position:absolute;left:0;top:0;transform-style:preserve-3d;cursor:pointer}
.in{transform-style:preserve-3d;transform:rotateZ(var(--rot,0deg));animation:bobT 6s ease-in-out infinite}
@keyframes bobT{50%{translate:0 -14px}}@keyframes spinY{to{rotate:y 360deg}}
.hl{position:absolute;left:0;bottom:56px;pointer-events:none;max-width:92%}
.hl h1{font-size:clamp(34px,6.2vw,78px);line-height:1;letter-spacing:-.045em;font-weight:600;margin:10px 0 0}.hl h1 span{color:var(--ac)}
.go{position:absolute;right:0;bottom:60px;display:flex;align-items:center;gap:12px;font-weight:600;text-transform:lowercase}
.go i{width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px;transition:transform .3s}
@media(hover:hover){.go:hover i{transform:translateX(6px)}}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;font-size:12px;color:var(--mut);pointer-events:none;letter-spacing:.04em;white-space:nowrap}
.cb{position:relative;width:var(--w);height:var(--h);transform-style:preserve-3d;margin:calc(var(--h)/-2) 0 0 calc(var(--w)/-2)}
.cb i{position:absolute;display:flex;align-items:center;justify-content:center;font-style:normal}
.cb .fr{inset:0;transform:translateZ(calc(var(--d)/2))}.cb .bk2{inset:0;transform:translateZ(calc(var(--d)/-2)) rotateY(180deg)}
.cb .lf{left:calc(var(--d)/-2);width:var(--d);height:100%;transform:rotateY(-90deg);filter:brightness(.8)}
.cb .rt{right:calc(var(--d)/-2);width:var(--d);height:100%;transform:rotateY(90deg);filter:brightness(.9)}
.cb .tp{top:calc(var(--d)/-2);width:100%;height:var(--d);transform:rotateX(90deg);filter:brightness(1.08)}
.cb .bt{bottom:calc(var(--d)/-2);width:100%;height:var(--d);transform:rotateX(-90deg);filter:brightness(.6)}
.book .fr,.book .bk2{background:linear-gradient(135deg,var(--bc),color-mix(in srgb,var(--bc) 62%,#000));border-radius:2px 8px 8px 2px;color:#fff;font:800 30px system-ui}
.book .lf{background:color-mix(in srgb,var(--bc) 65%,#000)}
.book .rt,.book .tp,.book .bt{background:repeating-linear-gradient(90deg,#fff 0 3px,#dcdcdc 3px 4px)}.book .rt{background:repeating-linear-gradient(0deg,#fff 0 3px,#dcdcdc 3px 4px)}
.pen{position:relative;width:0;height:0;transform-style:preserve-3d}
.pcl .fr,.pcl .bk2,.pcl .lf,.pcl .rt{background:linear-gradient(180deg,#ffd23f 0 86%,#c9c9c9 86% 92%,#ff7a7a 92%)}.pcl .tp{background:#f0c89c}.pcl .bt{background:#ff7a7a}
.tip{position:absolute;left:-10px;top:-111px;width:20px;height:36px;transform-style:preserve-3d}
.tip i{position:absolute;left:0;bottom:0;width:20px;height:36px;transform-origin:50% 100%;clip-path:polygon(0 100%,100% 100%,50% 0);background:linear-gradient(0deg,#f0c89c 68%,#2b2b2b 68%)}
.tip i:nth-child(1){transform:translateZ(10px) rotateX(16.1deg)}.tip i:nth-child(2){transform:rotateY(90deg) translateZ(10px) rotateX(16.1deg);filter:brightness(.88)}
.tip i:nth-child(3){transform:rotateY(180deg) translateZ(10px) rotateX(16.1deg);filter:brightness(.72)}.tip i:nth-child(4){transform:rotateY(270deg) translateZ(10px) rotateX(16.1deg);filter:brightness(.95)}
.rul i{background:linear-gradient(90deg,rgba(0,0,0,.7) 0 1.5px,transparent 1.5px) left bottom/8px 45% repeat-x,linear-gradient(#ffd54a,#f2b200)}
.abc i{background:var(--card);border:2px solid var(--ac);color:var(--ac);font:800 34px system-ui;border-radius:6px}
.glb{position:relative;width:110px;height:110px;margin:-55px 0 0 -55px;transform-style:preserve-3d}
.glb i{position:absolute;inset:0;border:1.5px solid var(--ac);border-radius:50%}.glb b{position:absolute;inset:6px;border-radius:50%;opacity:.55;background:radial-gradient(circle at 32% 28%,#fff,color-mix(in srgb,var(--ac) 22%,var(--card)) 75%)}
.mini{position:relative;width:110px;height:110px;perspective:600px;flex:none}.mini .obj{left:50%;top:50%}.mini .in{--rot:0deg;transform:rotateX(-18deg);animation:spinY 9s linear infinite}
.ovh{padding:10px 0 4px}.ovh h1{font-size:clamp(32px,5.6vw,66px);letter-spacing:-.045em;font-weight:600;line-height:1.02;margin:8px 0 12px}.lead{color:var(--mut);max-width:540px;font-size:16px;margin:0}
.stats{display:flex;margin:26px 0;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}.stats div{flex:1;padding:16px 0}
.stats b{display:block;font-size:clamp(30px,6vw,56px);font-weight:600;letter-spacing:-.04em;line-height:1.1}.stats span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.pr{display:flex;align-items:center;gap:16px;padding:12px 4px;border-bottom:1px solid var(--bd);text-align:left;width:100%;animation:up .6s both;transition:padding .25s,background .25s}
.pr .num{font-size:13px;color:var(--ac);font-weight:700;width:24px}.pr .pt{flex:1}.pr h3{margin:0;font-size:clamp(24px,4.4vw,38px);letter-spacing:-.035em;font-weight:600}
.pr .arr{font-size:28px;transition:transform .25s,color .25s}

@media(max-width:640px){.wrap{padding:4px 14px 60px}.hero{min-height:440px}.go{bottom:auto;top:4px}.go i{width:46px;height:46px}.hl{bottom:44px}.hint{white-space:normal;text-align:center;width:92%;font-size:11px}.pod{gap:16px}.pr .mini{width:84px;height:84px;margin:-6px}.pr .mini .obj{scale:.8}th,td{padding:9px 6px}}

/* ===== v11: Swell-inspired redesign (ink + electric blue, giant display type, pill UI, soft-blue dunes) ===== */
:root{--f-d:"Archivo","Arial Narrow",Impact,system-ui,sans-serif;--f-b:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--sky:#cfe1ff;--sky2:#e8f0ff}

/* header */
.top{position:sticky;top:0;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;padding:12px 0;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:30;border-bottom:1px solid transparent}

input:focus,select:focus,textarea:focus{border-color:var(--tx);background:var(--card)}
.card{border-radius:26px;padding:24px;border:1px solid var(--bd)}

/* page titles */

/* v17: podium redesign + crown for #1 */
.pod{margin:78px 14px 0 0;gap:16px;align-items:flex-end}
.step{--sc:#aab2c0;border-radius:16px 16px 0 0;padding:14px 8px 12px;border-color:color-mix(in srgb,var(--sc) 60%,var(--bd));background:linear-gradient(180deg,color-mix(in srgb,var(--sc) 24%,var(--card)),color-mix(in srgb,var(--sc) 6%,var(--card)))}
.step.s1{--sc:#f2b705;height:270px}.step.s2{--sc:#9aa4b6;height:212px}.step.s3{--sc:#cd7f32;height:168px}
.step:before,.step:after{background:var(--sc)}
.step:before{opacity:.5}.step:after{opacity:.85}
.step .rk{width:30px;height:30px;margin:0 auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 14px var(--f-b);color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--sc) 70%,#fff),var(--sc));box-shadow:0 4px 10px -3px var(--sc)}
.step.s1 .rk{color:#4a3300}
.step .sc0{font:800 clamp(24px,3.6vw,36px)/1.05 var(--f-d);color:var(--tx)}
.step.s1 .sc0{color:#d99100}
.step b{font-size:15px;line-height:1.25;margin-top:4px;padding:0 2px;word-break:keep-all}
.base{background:linear-gradient(#f2b705,#b87a00)}
.crown{position:absolute;left:50%;top:-74px;width:66px;translate:-50% 0;pointer-events:none;animation:crw 3.2s ease-in-out infinite alternate;filter:drop-shadow(0 8px 12px rgba(242,183,5,.55))}
.crown svg{display:block;width:100%}
.crown .cs{position:absolute;font-style:normal;color:#ffcf3a;text-shadow:0 0 10px rgba(255,200,40,.9);animation:tw 2.4s ease-in-out infinite}
.crown .cs.a{left:-20px;top:4px;font-size:14px}.crown .cs.b{right:-18px;top:-6px;font-size:18px;animation-delay:-.8s}.crown .cs.c{right:-6px;top:30px;font-size:11px;animation-delay:-1.6s}
@keyframes crw{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-7px) rotate(4deg)}}
.step.s1:after{animation:none}
.rw .n{font-weight:800}
@media(max-width:640px){.pod{gap:8px;margin-right:10px}.step b{font-size:13px}.crown{width:52px;top:-60px}}

/* v20: accent-driven theme, new settings panel, redesigned rating page */
:root[data-theme=light]{--bg:color-mix(in srgb,var(--ac) 6%,#fff);--card:color-mix(in srgb,var(--ac) 2%,#fff);--bd:color-mix(in srgb,var(--ac) 13%,#e6e6e6)}

:root[data-theme=light] body:not(.dk){background:radial-gradient(900px 600px at 92% -6%,color-mix(in srgb,var(--ac) 30%,transparent),transparent 60%),radial-gradient(800px 560px at -6% 100%,color-mix(in srgb,var(--ac) 16%,#7aa8ff),transparent 62%),radial-gradient(rgba(23,17,12,.07) 1px,transparent 1.2px) 0 0/22px 22px,color-mix(in srgb,var(--ac) 6%,#fff);background-attachment:fixed}
:root[data-theme=dark] body:not(.dk){background:radial-gradient(900px 600px at 92% -6%,color-mix(in srgb,var(--ac) 24%,transparent),transparent 60%),radial-gradient(800px 560px at -6% 100%,color-mix(in srgb,var(--ac) 12%,#4a6cff),transparent 62%),radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.2px) 0 0/22px 22px,#07080c;background-attachment:fixed}
:root[data-theme=light] body.dk{--bg:color-mix(in srgb,var(--ac) 6%,#fff);background:radial-gradient(900px 620px at 82% 30%,color-mix(in srgb,var(--ac) 38%,transparent),transparent 62%),radial-gradient(800px 560px at 6% 92%,color-mix(in srgb,var(--ac) 14%,#7aa8ff),transparent 62%),radial-gradient(640px 420px at 40% -8%,color-mix(in srgb,var(--ac) 14%,#ffe3b8),transparent 60%),color-mix(in srgb,var(--ac) 6%,#fff)}
:root[data-theme=dark] body.dk{background:radial-gradient(900px 600px at 80% 30%,color-mix(in srgb,var(--ac) 22%,transparent),transparent 62%),radial-gradient(800px 560px at 5% 95%,color-mix(in srgb,var(--ac) 10%,#4a6cff),transparent 62%),#05060a}
body:not(.dk)::after{background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--ac) 48%,transparent) 0 1.5px,transparent 1.5px 9px)}
body:not(.dk)::before{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--ac) 55%,#fff),var(--ac))}
.lp .shape svg{filter:hue-rotate(var(--hr,0deg)) drop-shadow(0 24px 40px color-mix(in srgb,var(--ac) 28%,transparent))}
.lp{--sl:#fff}
:root[data-theme=light] .lp{--sl:var(--ac);--sym:color-mix(in srgb,var(--ac) 32%,transparent)}
:root[data-theme=dark] .lp{--sym:color-mix(in srgb,var(--ac) 45%,transparent)}
.lpc .rt{color:color-mix(in srgb,var(--ac) 72%,#fff)}
:root[data-theme=light] .lpc .rt{color:var(--ac)}
.lp .star{color:color-mix(in srgb,var(--ac) 70%,#fff);text-shadow:0 0 12px color-mix(in srgb,var(--ac) 70%,transparent)}
:root[data-theme=light] .lp .sk i{background:var(--ac);box-shadow:0 0 10px 3px color-mix(in srgb,var(--ac) 50%,transparent)}
.hero.lp:before{background:radial-gradient(340px 340px at var(--mx,70%) var(--my,45%),color-mix(in srgb,var(--ac) 22%,transparent),transparent 70%)}
:root[data-theme=light] .hero.lp:before{background:radial-gradient(340px 340px at var(--mx,70%) var(--my,45%),rgba(255,255,255,.55),transparent 70%)}
.tag{background:color-mix(in srgb,var(--ac) 13%,#fff);color:color-mix(in srgb,var(--ac) 78%,#000)}
:root[data-theme=dark] .tag,body.dk .tag{background:color-mix(in srgb,var(--ac) 26%,var(--card));color:color-mix(in srgb,var(--ac) 50%,#fff)}
.cta{background:radial-gradient(ellipse 75% 42% at 12% 100%,color-mix(in srgb,var(--ac) 55%,#fff) 97%,transparent 100%),radial-gradient(ellipse 70% 38% at 90% 104%,color-mix(in srgb,var(--ac) 78%,#fff) 97%,transparent 100%),radial-gradient(ellipse 95% 30% at 50% 108%,color-mix(in srgb,var(--ac) 35%,#fff) 97%,transparent 100%),linear-gradient(180deg,color-mix(in srgb,var(--ac) 5%,#fff),color-mix(in srgb,var(--ac) 22%,#fff) 72%)}
@media(hover:hover){.pill:hover{background:var(--ac)}}

/* settings panel */
.pop.st{width:min(344px,calc(100vw - 28px));padding:18px;max-height:calc(100vh - 90px);max-height:calc(100dvh - 90px);overflow:auto}
.sth{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.sth h3{margin:0;font:800 16px var(--f-b);text-transform:none;letter-spacing:0}
.sth .ic{width:32px;height:32px;min-width:32px;min-height:32px;font-size:13px}
.thm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.tm{display:flex;flex-direction:column;gap:7px;padding:7px 7px 9px;border:1.5px solid var(--bd);border-radius:16px;background:var(--card);font:600 12.5px var(--f-b);transition:border-color .2s,box-shadow .2s}
.tm.on{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
.tm .mini{display:block;height:52px;border-radius:10px;position:relative;overflow:hidden;border:1px solid rgba(128,128,128,.25)}
.tm.light .mini{background:linear-gradient(135deg,#fff,color-mix(in srgb,var(--ac) 16%,#fff))}
.tm.dark .mini{background:linear-gradient(135deg,#0b0d14,color-mix(in srgb,var(--ac) 22%,#0b0d14))}
.mini i{position:absolute;left:9px;height:6px;border-radius:4px}
.mini i:nth-child(1){top:10px;width:48%;background:var(--ac)}
.mini i:nth-child(2){top:23px;width:72%;opacity:.3}.mini i:nth-child(3){top:35px;width:40%;opacity:.3}
.tm.light .mini i:nth-child(n+2){background:#111}.tm.dark .mini i:nth-child(n+2){background:#fff}
.swg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.sg{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px 8px;border-radius:14px;border:1.5px solid transparent;background:color-mix(in srgb,var(--tx) 5%,var(--card));transition:border-color .2s,background .2s,transform .2s}
@media(hover:hover){.sg:hover{transform:translateY(-2px)}}
.sg .dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:800 14px var(--f-b);background:radial-gradient(circle at 32% 28%,color-mix(in srgb,var(--c) 50%,#fff),var(--c) 64%);box-shadow:0 6px 14px -6px var(--c)}
.sg em{font:600 10.5px var(--f-b);color:var(--mut)}
.sg.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--card))}.sg.on em{color:var(--tx)}
.sg.on .dot:after{content:"✓"}
.sg.cus .dot{background:conic-gradient(#f26a1b,#f5b301,#12b886,#0a63ff,#8b5cf6,#ec4899,#f26a1b);box-shadow:none}
.sg.cus.on .dot{background:var(--c)}
.sg.cus input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}

/* rating page */
.rt-wrap{display:grid;gap:12px}
.rsec{margin:0;transition:opacity .3s,filter .3s}
.rsec.lock{opacity:.45;pointer-events:none;filter:saturate(.5)}
.rh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rh h3{margin:0;font:700 15px var(--f-b);text-transform:none;letter-spacing:0}
.rh small{margin-left:auto;font-size:12px}
.rn{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--ac);color:#fff;font:800 12px var(--f-b)}
.tsearch{margin-bottom:10px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;max-height:360px;overflow:auto;padding:2px}
.tcard{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--bd);border-radius:16px;background:var(--card);text-align:left;transition:transform .2s,border-color .2s,box-shadow .2s}
@media(hover:hover){.tcard:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 12px 24px -16px var(--ac)}.tcard:hover .tgo{transform:translateX(3px);color:var(--ac)}}
.tcard.done{opacity:.5;pointer-events:none}
.tav{--h:20;width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:800 17px var(--f-b);color:#fff;background:linear-gradient(145deg,hsl(var(--h) 85% 62%),hsl(calc(var(--h) + 40) 78% 45%));box-shadow:0 6px 14px -6px hsl(var(--h) 80% 50%)}
.tav.lg{width:56px;height:56px;font-size:23px}
.tci{display:flex;flex-direction:column;min-width:0}.tci b{font-size:14px}.tci small{color:var(--mut);font-size:12px}
.tgo{margin-left:auto;font-style:normal;color:var(--mut);transition:transform .2s,color .2s}
.tsel{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;background:var(--ac2);border:1px solid color-mix(in srgb,var(--ac) 35%,var(--bd))}
.tsel .tci b{font-size:17px}.tsel .btn{margin-left:auto}
.crit{padding:14px 2px;border-top:1px solid var(--bd)}.rh+.crit{border-top:0;padding-top:4px}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ci2{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--ac2)}
.ch b{display:block;font-size:14px}.lvl{display:block;color:var(--mut);font-size:12px;transition:color .2s}
.crit.set .lvl{color:var(--ac);font-weight:700}
.cv{margin-left:auto;font:800 24px var(--f-b);color:var(--mut)}.crit.set .cv{color:var(--tx)}
.stz{display:grid;grid-template-columns:repeat(5,1fr);direction:rtl;gap:6px}
.stz button{height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card);display:flex;align-items:center;justify-content:center;transition:transform .15s,border-color .15s,background .15s}

.sty2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border:1.5px solid var(--bd);border-radius:18px;background:var(--card);text-align:left;transition:border-color .2s,background .2s,box-shadow .2s,transform .2s}
.sopt .se{font-size:28px;margin-bottom:4px}.sopt b{font-size:16px}.sopt small{color:var(--mut);font-size:12px}
@media(hover:hover){.sopt:hover{transform:translateY(-2px);border-color:var(--ac)}}
.sopt.on{border-color:var(--ac);background:var(--ac2);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.rbar{position:sticky;bottom:12px;z-index:6;display:flex;align-items:center;gap:14px;padding:10px 10px 10px 18px;border-radius:99px;background:color-mix(in srgb,var(--card) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--bd);box-shadow:0 16px 34px -18px rgba(0,0,0,.45)}

.rb-l small{font:600 12px var(--f-b);color:var(--mut)}
.rbar .btn.p{padding:12px 28px;border-radius:99px;flex:none}
.rbar .btn.p.rdy{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 10px 22px -10px var(--ac)}
@media(max-width:480px){.tgrid{grid-template-columns:1fr}.rbar{padding-left:14px}.stz button{height:40px}}

.bseg{margin:0 0 12px}.bseg button{font-size:13px}.bseg small{opacity:.7;margin-left:4px}

.srtop{display:flex;align-items:center;gap:14px;margin-bottom:12px}.srtop b{display:block;font-size:15px}.srtop small{display:block;font-size:12px}
.srbig{white-space:nowrap;font:800 44px/1 var(--f-d);letter-spacing:-.04em;color:var(--ac)}.srbig small{font:600 14px var(--f-b);color:var(--mut)}
.srbars{display:flex;flex-direction:column;gap:10px}
.srbr{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:16px;border:1px solid var(--bd);background:var(--card)}
.srbr.best{border-color:color-mix(in srgb,var(--ok) 45%,var(--bd));background:color-mix(in srgb,var(--ok) 7%,var(--card))}
.sri{font-size:22px;line-height:1.2}.srbb{flex:1;min-width:0}.srbb>div{display:flex;align-items:center;gap:8px}.srbb b{font-size:13.5px}.srbb>div>span{margin-left:auto;font:800 15px var(--f-b);font-variant-numeric:tabular-nums}
.srbb em{font-style:normal;font-size:10px;font-weight:800;color:var(--ok)}
.srbb i{display:block;height:6px;border-radius:99px;margin:6px 0 4px;background:color-mix(in srgb,var(--tx) 8%,transparent);overflow:hidden}.srbb u{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ac),#ffb03a);animation:grow .9s both}
.srbb small{font-size:11.5px;color:var(--mut);line-height:1.4}
.srn{margin:10px 0 0;font-size:12px;color:var(--mut)}.srs>.btn{margin-top:12px}
.srlock{display:flex;align-items:center;gap:14px;padding:12px;border:1px dashed var(--bd);border-radius:16px}.srlock p{margin:0;font-size:13px;color:var(--mut)}
.srlr{--p:0;width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--ac) calc(var(--p)*1%),color-mix(in srgb,var(--tx) 9%,transparent) 0)}.srlr b{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--card);font:800 13px var(--f-b)}
.srpv{margin:16px 0 0;padding:14px;border-radius:20px;border:1px solid var(--bd);background:color-mix(in srgb,var(--ac) 4%,var(--card))}

/* ===== v29: professional look, single font, disclaimer ===== */
*,*::before,*::after{font-family:var(--f-b)!important}
:root{--dh:40px}
#deco{display:none!important}
body:not(.dk)::before,body:not(.dk)::after{display:none}
.lp .star,.lp .sym{display:none}
.lpc h1{font-weight:800;font-size:clamp(34px,6.4vw,92px);line-height:1.05;letter-spacing:-.025em;white-space:normal}
.lpc .rt{font-weight:600;font-size:clamp(18px,2.6vw,36px);letter-spacing:.3em}
#wipe b{font-weight:800;font-size:clamp(40px,9vw,110px);letter-spacing:-.02em}
.ci2,.cmi{font:700 13px var(--f-b);color:var(--ac);letter-spacing:.04em}
.wrap{padding-bottom:calc(70px + var(--dh))}
.rbar{bottom:calc(var(--dh) + 10px)}
.lpf{bottom:calc(var(--dh) + 16px)}
.toast{bottom:calc(var(--dh) + 20px)}
#disc{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:8px 16px;background:color-mix(in srgb,var(--bg) 96%,transparent);border-top:1px solid var(--bd);color:var(--mut);font:500 11px/1.45 var(--f-b);text-align:center}
#disc b{color:var(--tx);font-weight:700}
@media(max-width:640px){.lpc h1{font-size:clamp(30px,9.6vw,48px)}#disc{font-size:10px;padding:6px 10px}}

/* ===== v30: responsive tuning (phone -> desktop) ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{overflow-x:clip}
img,svg,video,canvas{max-width:100%}
button,a,.ob,[onclick]{touch-action:manipulation}
input,select,textarea{font-size:16px}
.ov{padding-bottom:var(--dh)!important}
.ov>*{max-height:calc(100dvh - var(--dh) - 12px);overflow-y:auto;overscroll-behavior:contain}
#disc{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lp{min-height:100vh;min-height:100dvh}
@media(hover:none){.lpf button{padding:12px 6px;min-height:44px}}
@media(max-width:640px){
  .lp .stage,.lp .ring{display:none}
  .lp .shape{opacity:.28}
  .lpc h1{font-size:clamp(32px,11vw,52px)}
  .lpc .rt{letter-spacing:.18em;font-size:16px}
  .lpb{gap:10px}
  .lpb .ob{flex:1 1 140px;justify-content:center;min-height:48px}
  .ann{font-size:10.5px;letter-spacing:.04em;padding:9px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ov>*{width:100%;border-radius:22px 22px 0 0}
}
@media(max-height:480px) and (orientation:landscape){
  .lp{min-height:auto}.lpc h1{font-size:clamp(26px,6vw,40px)}.lpf{position:static;margin-top:16px}
}
@media(min-width:1800px){html{font-size:17px}}

/* ===== v33: sound effects, new level rewards, level-up popup ===== */
.pav.fr4,.ttc.fr4{border-color:transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#ff3d00,#ff9800,#ffd54f) border-box}
.pav.fr4{box-shadow:0 0 0 4px var(--card),0 0 18px #ff6d00aa}
.pav.fr5,.ttc.fr5{border-color:transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#e0f7fa,#80deea,#b388ff,#e0f7fa) border-box}
.pav.fr5{box-shadow:0 0 0 4px var(--card),0 0 18px #80deeaaa}
.ttc.fr4,.ttc.fr5{border:2px solid transparent}
.pav.aura{animation:aur 2.4s ease-in-out infinite alternate}
@keyframes aur{from{filter:drop-shadow(0 0 3px var(--pc))}to{filter:drop-shadow(0 0 14px var(--pc))}}
[data-rm] .pav.aura{animation:none}
.bdg{margin-left:6px;font-style:normal;font-size:.95em}
.sndp{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sndp button{padding:7px 12px;border:1px solid var(--bd);border-radius:99px;font:600 12px var(--f-b);background:var(--card)}
.sndp button:active{transform:scale(.96)}
#lvup{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:20px;background:rgba(5,6,10,.62);animation:lvf .25s both}
@keyframes lvf{from{opacity:0}to{opacity:1}}
.lvc{position:relative;width:min(380px,100%);padding:30px 24px 22px;border-radius:26px;background:var(--card);color:var(--tx);border:1px solid var(--bd);text-align:center;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:lvp .55s cubic-bezier(.2,1.3,.3,1) both;overflow:hidden}
@keyframes lvp{from{transform:translateY(30px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.lvc small{letter-spacing:.2em;font-weight:700;color:var(--mut);font-size:11px}
.lvn{font:900 84px/1 var(--f-d);color:var(--ac);margin:6px 0 2px;text-shadow:0 8px 30px color-mix(in srgb,var(--ac) 50%,transparent)}
.lvc h3{margin:0 0 12px;font:800 20px var(--f-d)}
.lvr{display:grid;gap:6px;margin:0 0 16px;text-align:left}.lvr div{padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--ac) 10%,transparent);font-size:13.5px;font-weight:600}
.lvr div b{color:var(--ac);margin-right:6px}
.lvb{display:flex;gap:8px;justify-content:center}
.lvk{position:absolute;inset:0;pointer-events:none;overflow:hidden}.lvk i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;background:var(--c);left:var(--x);animation:lvk 1.8s var(--d) ease-in both}
@keyframes lvk{to{transform:translateY(440px) rotate(540deg);opacity:0}}
[data-rm] .lvk{display:none}
@media(max-width:560px){.stabs button{font-size:10px}.stabs button span{font-size:15px}}

.nw{grid-template-columns:90px 84px minmax(0,1fr)}.nw .tag{justify-self:start;text-align:center;min-width:64px}
.nwm{margin-top:16px}
@media(max-width:640px){.nw{grid-template-columns:auto minmax(0,1fr);gap:6px 12px}.nw .nwd{grid-column:1}.nw .tag{grid-column:2;justify-self:start}.nw>div{grid-column:1/-1}}
.nw .tag{background:var(--ac);color:#fff;opacity:1}

  else if(k==="close"){const o=[...all].sort((x,y)=>y.ov-x.ov);let m=9;o.forEach((r,i)=>{if(i&&o[i-1].ov-r.ov<m){m=o[i-1].ov-r.ov;a=o[i-1];b=r}})}

  else if(k==="mov"){const cu=rkm(w),pr=rkm(w-7*864e5),m=all.filter(r=>pr[r.x.id]).sort((x,y)=>Math.abs(pr[y.x.id]-cu[y.x.id])-Math.abs(pr[x.x.id]-cu[x.x.id]));a=m[0];b=m[1]}
  else if(k==="rnd"){const l=S.teachers.slice().sort(()=>Math.random()-.5);if(l.length>1){a={x:l[0]};b={x:l[1]}}}
  if(!a||!b)return toast(L("Chưa đủ dữ liệu cho gợi ý này.","Not enough data for this suggestion."));
  nav(()=>{S.cA=a.x.id;S.cB=b.x.id})}

const SNDK="vv_snd",SNDD={on:true,vol:55,ui:true,nt:true,lv:true,hov:false};
let SND=Object.assign({},SNDD);try{Object.assign(SND,JSON.parse(localStorage.getItem(SNDK)||"{}"))}catch(e){}
const SNDM={click:["click-soft-tap",.55],primary:["click-crisp-primary",.6],tick:["tap-ui-tick",.5],tab:["tab-switch",.55],on:["toggle-switch-on",.6],off:["toggle-switch-off",.6],nav:["nav-forward",.5],hover:["hover-soft",.22],open:["modal-open-rise",.5],close:["modal-close-fall",.45],ok:["success-warm-chime",.6],err:["error-soft-thud",.65],lvl:["level-up",.85],xp:["xp-up",.6],whoosh:["transition-smooth-whoosh",.5],pop:["pop-bubble",.55]};
const SNDG={click:"ui",primary:"ui",tick:"ui",tab:"ui",on:"ui",off:"ui",nav:"ui",hover:"hov",open:"nt",close:"nt",ok:"nt",err:"nt",whoosh:"nt",pop:"ui",lvl:"lv",xp:"lv"},SNDP={lvl:3,xp:2};
const SNA={};let sndLast=0,sndLP=0,sndArmed=false;
function sndSave(){try{localStorage.setItem(SNDK,JSON.stringify(SND))}catch(e){}}
function sndArm(){if(sndArmed)return;sndArmed=true;Object.keys(SNDM).forEach(k=>{try{const a=new Audio(SFXD[SNDM[k][0]]);a.preload="auto";SNA[k]=a}catch(e){}})}
function sfx(k,force){try{const g=SNDG[k];if(!force){if(!SND.on||!SND[g]||document.documentElement.hasAttribute("data-mute"))return;const n=Date.now(),p=SNDP[k]||1;if(n-sndLast<220&&p<=sndLP)return;sndLast=n;sndLP=p}
  sndArm();const a=SNA[k];if(!a)return;a.volume=Math.max(0,Math.min(1,SNDM[k][1]*SND.vol/100));a.currentTime=0;const r=a.play();if(r&&r.catch)r.catch(()=>{})}catch(e){}}
addEventListener("pointerdown",sndArm,{once:true,passive:true});
function sndSet(k,v){window.sfxSp&&window.sfxSp();SND[k]=v;sndSave();render();if(k==="on"&&v)sfx("ok",true)}

  off=SND.on?"":"opacity:.45;pointer-events:none";
